<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HW3: Web APIs and Fetch</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <h1 class="glitch" data-text="Rick & Morty search ">Rick & Morty search</h1>

  <div class="wrapper">

    <div class="controls">
      <form>
        <p>
          <label for="character-search">Search by Character: </label>
          <input type="text" id="character-search" class="search">
        </p>

        <p>
          <label for="location-search">Search by Location: </label>
          <input type="text" id="location-search" class="search">
        </p>

        <p>
          <label for="episode-search">Search by Episode: </label>
          <input type="text" id="episode-search" class="search" placeholder="Enter 'all' for all episodes">
        </p>
        
        <ul class="episode-message">
          <li>Episodes can be searched by:</li>
          <li>entering 1 episode </li> 
          <li>enterying multiple episodes ex: 1, 2, 3</li>
        </ul>

        <p>
          <button id="submit">Submit search</button>
        </p>
      </form>
    </div>

    <div id="results">
      <section id="section">
      </section>

      <div id="nav-container">
        <nav id="prev" class="nav">
          <button>Previous 20</button>
        </nav>
        <nav id="next" class="nav">
          <button>Next 20</button>
        </nav>
      </div>

      <section id="end">
      </section>
    </div>

  </div>

  <script src="js/script.js"></script>
</body>

</html>
